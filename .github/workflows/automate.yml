name: Generate FFG Graphics

# Run at 03:00z and 15:00z every day
on:
  schedule:
    - cron: '15 3,4,15,16 * * *'
  workflow_dispatch:

# CRITICAL FIX: Grants the Action permission to push the images to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Updated to v4 to fix the Node.js warning
    - name: Checkout repository
      uses: actions/checkout@v4

    # Updated to v5 to fix the Node.js warning
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (ecCodes & Cartopy reqs)
      run: |
        sudo apt-get update
        sudo apt-get install libeccodes0 libproj-dev proj-data proj-bin libgeos-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the Script
      run: python generate_ffg.py

    - name: Commit and Push New Images
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *_latest.png
        git add archive/*.png
        git commit -m "Automated graphics update" || echo "No changes to commit"
        git push
