name: Generate FFG Graphics

# Run at 03:00z and 15:00z every day
on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch: # Allows you to click a "Run Now" button manually to test it!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (ecCodes & Cartopy reqs)
      run: |
        sudo apt-get update
        sudo apt-get install libeccodes0 libproj-dev proj-data proj-bin libgeos-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the Script
      run: python generate_ffg.py

    - name: Commit and Push New Images
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add *_latest.png
        git add archive/*.png
        git commit -m "Automated graphics update" || echo "No changes to commit"
        git push
